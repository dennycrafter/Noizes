name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/Noizes/Noizes.csproj -c Release

      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "src/Noizes/bin/Release/net8.0-windows/Noizes.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "selftest.log") { Get-Content "selftest.log" }
          exit $p.ExitCode

      - name: Publish self-contained exe
        run: dotnet publish src/Noizes/Noizes.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      # verifies installer/noizes.iss still compiles (the release build only runs on tags)
      - name: Compile installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION=0.0.0-ci installer/noizes.iss
